<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sagar Accounts — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e1b4b, #0f172a, #020617);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .login-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px var(--primary-glow);
        }
        .login-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
        }
        .login-subtitle {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .error-banner {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .credentials-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 22px;
            text-align: left;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .cred-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cred-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .cred-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .cred-row strong {
            color: #f8fafc;
            font-family: monospace;
            font-size: 0.95rem;
        }
        .cred-row .label {
            color: #64748b;
            font-size: 0.8rem;
        }
        .alt-pw {
            color: #64748b;
            font-size: 0.75rem;
        }
        .alt-pw code {
            color: #94a3b8;
        }
        .btn-autofill {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(56, 189, 248, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-autofill:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(56, 189, 248, 0.4));
            border-color: #38bdf8;
            color: white;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">
            <i class="fas fa-calculator"></i>
        </div>
        <div class="login-title">SAGAR ACCOUNTS</div>
        <div class="login-subtitle">Standalone Financial Management System</div>

        {% if error %}
        <div class="error-banner">
            <i class="fas fa-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <div class="credentials-box">
            <div class="cred-header">
                <span><i class="fas fa-file-invoice-dollar"></i> Accounts Login</span>
                <span class="cred-badge">Standalone</span>
            </div>
            <div class="cred-row">
                <div>
                    <div><span class="label">Username:</span> <strong>accounts</strong></div>
                    <div><span class="label">Password:</span> <strong>1234</strong> <span class="alt-pw">(or <code>accounts</code>)</span></div>
                </div>
                <button type="button" class="btn-autofill" onclick="fillCreds('accounts', '1234')">
                    <i class="fas fa-magic"></i> Auto-fill Accounts
                </button>
            </div>
        </div>

        <form action="/login" method="POST">
            <div class="form-group" style="text-align: left;">
                <label class="form-label"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username (accounts)" required autofocus>
            </div>

            <div class="form-group" style="text-align: left;">
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password (1234)" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px;">
                <i class="fas fa-sign-in-alt"></i> Access Accounts Portal
            </button>
        </form>
    </div>

    <script>
        function fillCreds(u, p) {
            const uField = document.getElementById('username');
            const pField = document.getElementById('password');
            if (uField && pField) {
                uField.value = u;
                pField.value = p;
                pField.focus();
            }
        }
    </script>
</body>
</html>
